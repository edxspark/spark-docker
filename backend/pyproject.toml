[project]
name = "spark-video-tools-backend"
version = "0.1.0"
description = "YouTube 视频搬运流水线：下载 / 翻译 / 配音 / 发布"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "yt-dlp>=2024.8.6",
    # YouTube 提取所需：
    #  - curl-cffi 提供 impersonation（TLS 指纹伪装），缺失会直接报
    #    "The extractor specified to use impersonation for this download, but impersonation is not available"
    #  - yt-dlp-ejs 提供 JS 挑战求解器组件，缺失时会告警并可能拿不到全部清晰度
    "curl-cffi>=0.7.0",
    "yt-dlp-ejs>=0.3.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
publish = ["playwright>=1.45.0"]
dub = ["demucs>=4.0.1"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI 的 Depends()/Query() 必须写在默认参数里，属正常用法
ignore = ["E501", "B008"]
